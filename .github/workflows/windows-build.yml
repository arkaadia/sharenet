name: Windows Desktop Build & Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Application & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Verify Application CLI
        run: |
          python main.py --version

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name OutlookShareManager `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtGui `
            --hidden-import PySide6.QtWidgets `
            --hidden-import jdatetime `
            main.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Compile Windows Installer
        run: |
          mkdir installer_output
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/OutlookShareManager.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutlookShareManager-Setup
          path: installer_output/OutlookShareManager-Setup.exe
          if-no-files-found: error

      - name: Upload Standalone App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutlookShareManager-Windows-x64
          path: dist/OutlookShareManager/
          if-no-files-found: error
